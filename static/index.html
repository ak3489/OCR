<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR 图片文字识别</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #20242d;
    --border: #2c313c;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --accent-hover: #6ba0ff;
    --ok: #37c871;
    --err: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 28px 24px 8px;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; font-size: 14px; }
  #model-info { margin-top: 8px; font-size: 12px; }
  #model-info code {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 7px;
    color: var(--accent);
    font-family: Consolas, monospace;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 24px 80px; }

  #drop {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    background: var(--panel);
  }
  #drop:hover, #drop.drag { border-color: var(--accent); background: var(--panel-2); }
  #drop strong { color: var(--accent); }
  #drop small { display: block; color: var(--muted); margin-top: 6px; }

  #toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin: 18px 0;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--accent-hover); }
  button.ghost { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
  button.ghost:hover { background: #272c37; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  #status { color: var(--muted); font-size: 13px; margin-left: auto; }

  #name-field {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  #filename {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 14px;
    width: 150px;
  }
  #filename:focus { outline: none; border-color: var(--accent); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 14px;
  }
  .thumb {
    width: 100%;
    height: 150px;
    object-fit: contain;
    background: #0b0d11;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .card h3 {
    margin: 0 0 8px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
  .badge.ok { background: rgba(55,200,113,.15); color: var(--ok); }
  .badge.err { background: rgba(255,92,92,.15); color: var(--err); }
  .badge.run { background: rgba(79,140,255,.15); color: var(--accent); }
  textarea {
    width: 100%;
    min-height: 118px;
    resize: vertical;
    background: #0b0d11;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-family: "Consolas", "Microsoft YaHei", monospace;
    font-size: 13px;
  }
  .card-actions { margin-top: 8px; display: flex; gap: 8px; }
  .card-actions button { padding: 5px 12px; font-size: 12px; }
  @media (max-width: 640px) {
    .card { grid-template-columns: 1fr; }
    .thumb { height: 180px; }
  }
</style>
</head>
<body>
<header>
  <h1>OCR 图片文字识别</h1>
  <p>拖入或选择图片，自动识别中文/英文文字，可复制或导出为 txt。</p>
  <p id="model-info" class="model-info"></p>
</header>
<main>
  <div id="drop">
    <div>把图片拖到这里、<strong>点击选择</strong>，或按 <strong>Ctrl+V 粘贴</strong></div>
    <small>支持 jpg / png / bmp / tif / webp，可多选、可批量、可重复粘贴</small>
    <input id="picker" type="file" accept="image/*" multiple hidden>
  </div>

  <div id="toolbar">
    <button id="run" disabled>开始识别</button>
    <label id="name-field">文件名
      <input id="filename" type="text" value="全部结果" placeholder="导出文件名" title="导出 txt 的文件名">
    </label>
    <button id="export" class="ghost" disabled>导出全部 txt</button>
    <button id="clear" class="ghost" disabled>清空</button>
    <span id="status">未选择图片</span>
  </div>

  <div id="list"></div>
</main>

<script>
const drop = document.getElementById('drop');
const picker = document.getElementById('picker');
const listEl = document.getElementById('list');
const runBtn = document.getElementById('run');
const exportBtn = document.getElementById('export');
const clearBtn = document.getElementById('clear');
const statusEl = document.getElementById('status');
const filenameInput = document.getElementById('filename');

let items = [];

function naturalCompare(a, b) {
  return a.name.localeCompare(b.name, 'zh', { numeric: true, sensitivity: 'base' });
}

function setStatus() {
  const done = items.filter(i => i.state === 'ok').length;
  const running = items.some(i => i.state === 'run');
  statusEl.textContent = items.length
    ? `共 ${items.length} 张，已完成 ${done} 张${running ? '，识别中…' : ''}`
    : '未选择图片';
  runBtn.disabled = !items.length || running;
  exportBtn.disabled = !items.some(i => i.state === 'ok');
  clearBtn.disabled = !items.length;
}

function render() {
  listEl.innerHTML = '';
  for (const item of items) {
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = item.url;
    img.alt = item.name;

    const right = document.createElement('div');
    const h3 = document.createElement('h3');
    h3.textContent = item.name;
    const badge = document.createElement('span');
    badge.className = 'badge ' + (item.state === 'ok' ? 'ok' : item.state === 'err' ? 'err' : item.state === 'run' ? 'run' : '');
    badge.textContent = item.state === 'ok' ? '完成' : item.state === 'err' ? '失败' : item.state === 'run' ? '识别中' : '待识别';
    h3.appendChild(badge);

    const ta = document.createElement('textarea');
    ta.value = item.text || '';
    ta.placeholder = item.error || '识别结果会显示在这里';
    ta.addEventListener('input', () => { item.text = ta.value; });

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const copy = document.createElement('button');
    copy.className = 'ghost';
    copy.textContent = '复制';
    copy.addEventListener('click', () => {
      navigator.clipboard.writeText(ta.value);
      copy.textContent = '已复制';
      setTimeout(() => copy.textContent = '复制', 1200);
    });
    actions.appendChild(copy);

    right.append(h3, ta, actions);
    card.append(img, right);
    listEl.appendChild(card);
  }
  setStatus();
}

let pasteCounter = 0;

function extFromType(type) {
  const sub = (type || '').split('/')[1] || 'png';
  if (sub === 'jpeg' || sub === 'jpg') return 'jpg';
  return sub.replace(/\+xml$/, '');
}

function addFiles(files, pasted) {
  const added = [];
  for (const f of files) {
    if (f.type && !f.type.startsWith('image/')) continue;
    let name = f.name;
    if (pasted || !name) {
      pasteCounter += 1;
      name = `粘贴图片-${pasteCounter}.${extFromType(f.type)}`;
    }
    added.push({
      name: name,
      file: f,
      url: URL.createObjectURL(f),
      text: '',
      state: 'idle'
    });
  }
  if (!added.length) return;
  added.sort(naturalCompare);
  items = items.concat(added).sort(naturalCompare);
  render();
}

function handlePaste(e) {
  const data = e.clipboardData;
  if (!data) return;
  const files = [];
  if (data.items) {
    for (const it of data.items) {
      if (it.kind === 'file' && it.type.startsWith('image/')) {
        const f = it.getAsFile();
        if (f) files.push(f);
      }
    }
  }
  if (!files.length && data.files) {
    for (const f of data.files) {
      if (f.type.startsWith('image/')) files.push(f);
    }
  }
  if (!files.length) return; // 非图片，交给默认粘贴行为
  e.preventDefault();
  addFiles(files, true);
}

async function ocrOne(item) {
  item.state = 'run';
  item.text = '';
  item.error = '';
  render();
  try {
    const fd = new FormData();
    fd.append('file', item.file, item.name);
    const resp = await fetch('/api/ocr', { method: 'POST', body: fd });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    item.text = data.text || '';
    item.state = 'ok';
  } catch (e) {
    item.state = 'err';
    item.error = '识别失败：' + e.message;
  }
  render();
}

async function runAll() {
  for (const item of items) {
    if (item.state !== 'ok') await ocrOne(item);
  }
}

function exportAll() {
  const parts = items
    .filter(i => i.state === 'ok')
    .map(i => `===== ${i.name} =====\n${i.text}\n`);
  const blob = new Blob([parts.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  let name = (filenameInput.value || '').trim().replace(/[\\/:*?"<>|]/g, '_');
  if (!name) name = '全部结果';
  a.download = name.replace(/\.txt$/i, '') + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

drop.addEventListener('click', () => picker.click());
picker.addEventListener('change', () => { addFiles(picker.files); picker.value = ''; });
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('drag');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('drag');
}));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
document.addEventListener('paste', handlePaste);

runBtn.addEventListener('click', runAll);
exportBtn.addEventListener('click', exportAll);
clearBtn.addEventListener('click', () => {
  items.forEach(i => URL.revokeObjectURL(i.url));
  items = [];
  render();
});

render();

const modelInfoEl = document.getElementById('model-info');
fetch('/api/model')
  .then(r => r.json())
  .then(m => {
    let s = `当前模型（语言 <code>${m.lang}</code>，版本 <code>${m.ocr_version}</code>）：` +
            `检测 <code>${m.det}</code> · 识别 <code>${m.rec}</code>`;
    if (m.orient) s += ` · 方向 <code>${m.orient}</code>`;
    modelInfoEl.innerHTML = s;
  })
  .catch(() => {});
</script>
</body>
</html>
